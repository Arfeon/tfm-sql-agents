# Infraestructura local del TFM: Postgres+pgvector y Neo4j.
# Levanto todo con `docker compose up -d`. Las credenciales cuadran con mi .env.
#
# Postgres expone dos bases en la misma instancia:
#   - graphsql_memory  -> memoria/checkpoints de LangGraph + pgvector
#   - arcadia          -> BD objetivo que consulto en lenguaje natural (setup/datasets/arcadia)
# La imagen pgvector/pgvector ya trae el binario de pgvector instalado, pero cada
# base hay que activarla con `CREATE EXTENSION vector`. Eso lo hace automáticamente
# el script setup/infra/postgres/init/01-init.sh en las dos bases, en el primer arranque.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: graphsql_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Patata1234$$}
      POSTGRES_DB: ${POSTGRES_DB:-graphsql_memory}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./setup/infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h localhost fuerza TCP: el servidor temporal del init solo escucha por
      # socket Unix, así que el check no da "healthy" hasta que el init ha acabado.
      # La segunda condición exige el marcador que 01-init.sh crea AL FINAL: un init
      # interrumpido (volumen a medias, los scripts no se reintentan) queda unhealthy
      # y visible, en vez de "sano" pero sin datos. El start_period cubre el primer
      # arranque (crear las BDs y cargar Arcadia y Nebula tarda ~2 min).
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d graphsql_memory && psql -U postgres -d graphsql_memory -tAc \"SELECT to_regclass('public.setup_init_complete') IS NOT NULL\" | grep -q t"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 300s

  neo4j:
    image: neo4j:5-community
    container_name: graphsql_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-Patata1234$$}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"   # navegador web de Neo4j
      - "7687:7687"   # protocolo Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # Neo4j tarda en arrancar (JVM + plugin APOC), sobre todo la primera vez.
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 120s

  # La demo "solo con Docker": el CLI empaquetado en una imagen (ver Dockerfile), para
  # evaluar el proyecto sin instalar Node. Va bajo el profile `demo` a propósito: el
  # `docker compose up -d` de siempre NO lo toca (ni el preflight del CLI local). Uso:
  #   docker compose --profile demo build
  #   docker compose --profile demo run --rm cli
  # Es interactivo (menús), por eso `run` y no `up`.
  cli:
    build: .
    image: graphsql-cli
    profiles: ["demo"]
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      # Hosts de la red interna de compose (el .env de la imagen apunta a localhost).
      POSTGRES_HOST: postgres
      NEO4J_URI: neo4j://neo4j:7687
      TARGET_DB_1_HOST: postgres
      TARGET_DB_2_HOST: postgres
      # Credenciales: las MISMAS expresiones con las que se crean postgres y neo4j,
      # para que siempre cuadren, haya o no un .env en la máquina anfitriona.
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Patata1234$$}
      TARGET_DB_1_USER: ${POSTGRES_USER:-postgres}
      TARGET_DB_1_PASSWORD: ${POSTGRES_PASSWORD:-Patata1234$$}
      TARGET_DB_2_USER: ${POSTGRES_USER:-postgres}
      TARGET_DB_2_PASSWORD: ${POSTGRES_PASSWORD:-Patata1234$$}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-Patata1234$$}
      # Proveedor de LLM: se toma del .env del anfitrión si existe (compose lo lee para
      # interpolar). Para OpenAI basta con OPENAI_API_KEY; para LM Studio, el servidor
      # corre en el anfitrión, de ahí el host.docker.internal.
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LMSTUDIO_BASE_URL: http://host.docker.internal:1234/v1
    extra_hosts:
      # En Docker Desktop (Windows/Mac) ya existe; esta línea lo añade también en Linux.
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
